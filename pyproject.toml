[project]
name = "rankscope"
version = "0.2.0"
description = "Retrieval Eval that says how sure it is: confidence intervals, miss attribution, rank fusion and a calibrated abstain gate for search and RAG pipelines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Madaminov Sardor" }]
keywords = ["information-retrieval", "evaluation", "rag", "trec", "rank-fusion", "conformal", "abstention"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rankscope = "rankscope.cli:main"

[project.urls]
Documentation = "https://github.com/Sardor-M/rankscope/tree/main/docs"
Source = "https://github.com/Sardor-M/rankscope"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rankscope"]

[tool.hatch.build.targets.sdist]
include = ["src/rankscope", "tests", "docs", "examples", "reference", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
