name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: rankscope synth --out data/synth && rankscope evaluate --lane data/synth/lanes/lexical.run --lane data/synth/lanes/dense.run --qrels data/synth/qrels.txt --strata data/synth/strata.tsv --group-sep "#" --quiet

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e .
      - run: rankscope goldens --out /tmp/goldens.txt && node reference/js/check.mjs /tmp/goldens.txt
